name = "yanta-cloud"
main = "src/index.js"
compatibility_date = "2025-01-01"

workers_dev = true

[vars]
APP_ORIGIN = "https://yanta.page"
APP_NAME = "YANTA"
FROM_EMAIL = "YANTA <login@mail.yanta.page>"
PUBLIC_API_BASE_URL = "https://yanta.page/cloud-api"
COOKIE_NAME = "yanta_cloud_session"
COOKIE_DOMAIN = ""
OPENROUTER_SITE_URL = "https://yanta.page"
OPENROUTER_APP_TITLE = "YANTA"

[[d1_databases]]
binding = "DB"
database_name = "yanta-cloud-db"
database_id = "30d0c5f8-22fb-41bf-beef-dd8b3dfba245"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "yanta-cloud-objects"